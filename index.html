<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konan – Simulatore di Casi Clinici</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M30 14h4v16h16v4H34v16h-4V34H14v-4h16z' fill='white'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  html{scroll-behavior:smooth}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#f8fafc;color:#0f172a;-webkit-tap-highlight-color:transparent}
  .scroll-thin::-webkit-scrollbar{height:6px;width:6px}
  .scroll-thin::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9999px}

  /* Bottoni e componenti base */
  :where(button:not(:disabled),[data-action]:not(:disabled),[role=button]){cursor:pointer}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-weight:600;font-size:.875rem;border-radius:.75rem;padding:.6rem 1rem;transition:all .15s;cursor:pointer;border:1px solid transparent;line-height:1.2}
  .btn-primary{background:#2563eb;color:#fff;box-shadow:0 4px 12px -4px rgba(37,99,235,.55)}
  .btn-primary:hover{background:#1d4ed8}
  .btn-primary:disabled{background:#cbd5e1;color:#64748b;box-shadow:none;cursor:not-allowed}
  .btn-outline{background:#fff;color:#1e293b;border-color:#cbd5e1}
  .btn-outline:hover{background:#f1f5f9}
  .btn-sm{padding:.4rem .75rem;font-size:.8rem}
  .btn-lg{padding:.95rem 1.25rem;font-size:1rem;border-radius:1rem}
  .btn-done{background:#ecfdf5;color:#047857;border-color:#a7f3d0;cursor:default}
  .btn-icon{width:2.4rem;height:2.4rem;border-radius:.75rem;display:inline-flex;align-items:center;justify-content:center;border:1px solid #e2e8f0;background:#fff;color:#334155;cursor:pointer;flex:none}
  .btn-icon:hover{background:#f1f5f9}
  .badge{display:inline-flex;align-items:center;gap:.25rem;font-size:.7rem;font-weight:700;padding:.2rem .55rem;border-radius:9999px;line-height:1.2}
  .tag{font-size:.7rem;font-weight:600;padding:.15rem .55rem;border-radius:.5rem;background:#eff6ff;color:#1d4ed8}
  .field{width:100%;border:1px solid #cbd5e1;background:#fff;border-radius:.75rem;padding:.6rem .8rem .6rem 2.4rem;font-size:.9rem;outline:none;transition:box-shadow .15s,border-color .15s}
  .field:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.18)}
  .select{border:1px solid #cbd5e1;background:#fff;border-radius:.75rem;padding:.6rem .6rem;font-size:.85rem;outline:none;min-width:0;width:100%}
  .select:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.18)}

  /* Card libreria */
  .card-caso{transition:transform .15s,box-shadow .15s,border-color .15s}
  .card-caso:hover{transform:translateY(-2px);box-shadow:0 12px 28px -12px rgba(37,99,235,.4);border-color:#93c5fd}

  /* Chat */
  .chat-area{height:calc(100vh - 380px);height:calc(100dvh - 380px);min-height:300px;max-height:620px}
  .bubble{max-width:84%;padding:.6rem .9rem;font-size:.92rem;line-height:1.4;animation:pop .22s ease-out}
  .bubble-user{background:#2563eb;color:#fff;border-radius:18px 18px 4px 18px;margin-left:auto}
  .bubble-pz{background:#fff;color:#0f172a;border-radius:18px 18px 18px 4px;border:1px solid #e2e8f0;box-shadow:0 1px 2px rgba(15,23,42,.05)}
  .typing{display:inline-flex;gap:4px;padding:.75rem .9rem;background:#fff;border:1px solid #e2e8f0;border-radius:18px 18px 18px 4px}
  .typing span{width:6px;height:6px;border-radius:9999px;background:#94a3b8;animation:blink 1s infinite}
  .typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}

  /* FAB + drawer */
  .fab{position:fixed;right:1rem;bottom:1.25rem;z-index:40;display:inline-flex;align-items:center;gap:.5rem;padding:.85rem 1.25rem;border-radius:9999px;background:#2563eb;color:#fff;font-weight:700;font-size:.95rem;box-shadow:0 12px 28px -6px rgba(37,99,235,.6);cursor:pointer;border:0}
  .fab:hover{background:#1d4ed8}
  .drawer-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
  .drawer-sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:42rem;z-index:51;background:#fff;border-radius:1.5rem 1.5rem 0 0;box-shadow:0 -10px 40px rgba(15,23,42,.25);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
  .drawer.open .drawer-backdrop{opacity:1;pointer-events:auto}
  .drawer.open .drawer-sheet{transform:translateY(0)}
  .q-item{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;padding:.75rem .9rem;border:1px solid #e2e8f0;border-radius:.9rem;background:#fff;font-size:.9rem;font-weight:500;cursor:pointer;transition:all .15s}
  .q-item:hover:not(:disabled){border-color:#93c5fd;background:#f8fbff}
  .q-item:disabled{background:#f1f5f9;color:#94a3b8;cursor:not-allowed}

  /* Sagoma interattiva */
  .body-map{position:relative;width:100%;max-width:320px;aspect-ratio:360/620;margin:0 auto}
  .hotspot{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:9999px;display:flex;align-items:center;justify-content:center;color:#fff;border:3px solid #fff;box-shadow:0 3px 10px rgba(15,23,42,.3);transition:transform .15s,background .2s;cursor:pointer;z-index:2}
  .hotspot:hover{transform:translate(-50%,-50%) scale(1.15)}
  .hotspot.neutro{background:#94a3b8}
  .hotspot.ok{background:#16a34a}
  .hotspot.patologico{background:#ea580c}
  .hotspot.neutro::after{content:'';position:absolute;inset:-7px;border-radius:9999px;border:2px solid #94a3b8;animation:ring 1.9s ease-out infinite;pointer-events:none}
  @keyframes ring{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.35);opacity:0}}
  .dot{display:inline-block;width:.7rem;height:.7rem;border-radius:9999px;flex:none}
  .dot.neutro{background:#94a3b8}.dot.ok{background:#16a34a}.dot.patologico{background:#ea580c}

  /* Referto */
  .referto{background:#fff;border:1px solid #cbd5e1;border-top:6px solid #1e3a8a;border-radius:.25rem;font-family:Georgia,"Times New Roman",serif;box-shadow:0 1px 3px rgba(15,23,42,.08);color:#1e293b}
  .referto p{margin:.2rem 0}

  /* Diagnosi */
  .dx-opt{display:flex;align-items:center;gap:.75rem;width:100%;text-align:left;padding:.9rem 1rem;border:2px solid #e2e8f0;border-radius:1rem;background:#fff;font-weight:600;cursor:pointer;transition:all .15s}
  .dx-opt:hover{border-color:#93c5fd;background:#f8fbff}
  .dx-opt.sel{border-color:#2563eb;background:#eff6ff}
  .dx-opt .radio{width:1.25rem;height:1.25rem;border-radius:9999px;border:2px solid #94a3b8;flex:none;position:relative}
  .dx-opt.sel .radio{border-color:#2563eb}
  .dx-opt.sel .radio::after{content:'';position:absolute;inset:3px;background:#2563eb;border-radius:9999px}

  /* Modali / lightbox / toast */
  .modal-backdrop{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.62);display:flex;padding:1rem;overflow-y:auto;animation:fade .2s ease-out}
  .modal-card{margin:auto;background:#fff;border-radius:1.25rem;width:100%;max-width:42rem;overflow:hidden;box-shadow:0 25px 60px rgba(15,23,42,.4);animation:pop .25s ease-out}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .lightbox{position:fixed;inset:0;z-index:80;background:rgba(2,6,23,.94);display:flex;flex-direction:column;animation:fade .2s}
  .lb-bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.75rem 1rem}
  .lb-stage{flex:1;overflow:auto;display:flex;padding:1rem}
  #lb-img{margin:auto;max-width:100%;max-height:100%;border-radius:.5rem;cursor:zoom-in;background:#000}
  #lb-img.zoom{width:220%;max-width:none;max-height:none;cursor:zoom-out}
  .toast{background:#0f172a;color:#fff;font-size:.85rem;font-weight:500;padding:.6rem 1rem;border-radius:9999px;box-shadow:0 10px 25px rgba(15,23,42,.35);animation:pop .25s ease-out;transition:opacity .3s,transform .3s}
  .toast.out{opacity:0;transform:translateY(8px)}
  .fade-in{animation:fade .25s ease-out}
</style>
</head>
<body>
<noscript>Konan richiede JavaScript per funzionare.</noscript>
<div id="app"></div>
<div id="modal-root"></div>
<div id="lightbox-root"></div>
<div id="toast-root" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-[90] flex flex-col items-center gap-2 pointer-events-none"></div>

<!-- =====================================================================
     DATABASE CASI CLINICI
     Per aggiungere un caso: incolla un nuovo oggetto nell'array CASI_CLINICI.
     ===================================================================== -->
<script id="dati-casi">
const slug = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const Q = (...r) => r.map((x,i) => ({ id:'q'+(i+1), domanda:x[0], risposta:x[1] }));
const DX = (...t) => t.map((x,i) => ({ id:'d'+(i+1), testo:x, corretta:i===0 }));
const L = (nome, desc, costo, testo, rangeNormale, patologico, essenziale, o={}) => ({
  id: 'lab-' + slug(nome),
  nome,
  desc,
  costo,
  essenziale: !!essenziale,
  patologico: !!patologico,
  esito: testo,
  rangeNormale,
  pannello: o.pannello || null
});

const MOD = {
  ecg:{ servizio:'Servizio di Cardiologia – Elettrocardiografia', tecnica:'Tracciato a 12 derivazioni, velocità 25 mm/s, ampiezza 10 mm/mV', medico:'Dott. A. Ferrari' },
  eco:{ servizio:'Servizio di Ecografia Diagnostica', tecnica:'Scansioni multiplanari con sonda convex 3.5 MHz / lineare 7.5 MHz', medico:'Dott.ssa M. Bianchi' },
  ecocardio:{ servizio:'Servizio di Cardiologia – Ecocardiografia', tecnica:'Ecocardiogramma transtoracico M-mode, 2D e Doppler (colore, pulsato, continuo)', medico:'Dott. G. Romano' },
  rx:{ servizio:'Servizio di Radiologia Generale', tecnica:'Esame eseguito secondo protocollo standard', medico:'Dott. F. Marchetti' },
  tc:{ servizio:'Servizio di Radiologia – Tomografia Computerizzata', tecnica:'Acquisizione volumetrica multistrato con ricostruzioni multiplanari', medico:'Dott.ssa L. Conti' },
  rm:{ servizio:'Servizio di Risonanza Magnetica', tecnica:'Sequenze T1, T2, FLAIR e DWI con magnete 1.5 T', medico:'Dott. P. Greco' },
  emg:{ servizio:'Servizio di Neurofisiologia Clinica', tecnica:'Studio della conduzione nervosa sensitivo-motoria ed EMG con ago concentrico', medico:'Dott.ssa C. Villa' },
  endo:{ servizio:'Servizio di Endoscopia Digestiva', tecnica:'Esame eseguito in sedazione cosciente con videoendoscopio flessibile', medico:'Dott. S. Moretti' },
  spiro:{ servizio:'Servizio di Fisiopatologia Respiratoria', tecnica:'Spirometria globale con test di broncodilatazione', medico:'Dott.ssa E. Gallo' },
  gen:{ servizio:'Servizio di Diagnostica Clinica', tecnica:'Esame eseguito secondo protocollo standard', medico:'Dott. R. Costa' }
};
const IMG_MOD = ['ecg','eco','ecocardio','rx','tc','rm','endo'];
const S = (nome, desc, costo, ess, mod, indicazione, testo, o={}) => {
  const m = MOD[mod] || MOD.gen;
  return {
    id:'str-'+slug(nome), nome, desc, costo, essenziale:!!ess,
    haImmagine: mod === 'ecg',
    immagineTipo: o.tipo || (mod==='ecg' ? 'ecg-normale' : mod),
    refertoFormale:{ servizio:o.servizio||m.servizio, indicazione, tecnica:o.tecnica||m.tecnica, testo, medico:o.medico||m.medico }
  };
};

const EO_BASE = {
  snc:{ e:'Sistema Neurologico', r:[['Stato mentale','Vigile, collaborante, orientato nel tempo e nello spazio'],['Pupille','Isocoriche, isocicliche, normoreagenti alla luce']] },
  occhi:{ e:'Occhi e Sclere', r:[['Sclere','Bianche, non itteriche'],['Congiuntive','Normocromiche']] },
  collo:{ e:'Collo e Tiroide', r:[['Palpazione','Tiroide non palpabile, non adenopatie laterocervicali'],['Giugulari','Non turgide a 45°']] },
  torace:{ e:'Apparato Respiratorio', r:[['Auscultazione','Murmure vescicolare fisiologico, nessun rumore patologico'],['Espansibilità','Simmetrica, nessuna dispnea a riposo']] },
  cuore:{ e:'Apparato Cardiocircolatorio', r:[['Toni cardiaci','Toni validi e ritmici, pause libere, non soffi']] },
  addome:{ e:'Addome / Apparato Digerente', r:[['Ispezione','Addome piano'],['Palpazione','Trattabile, non dolente, non masse; Blumberg negativo'],['Peristalsi','Presente e normale']] },
  renale:{ e:'Apparato Urogenitale', r:[['Manovra di Giordano','Negativa bilateralmente'],['Ispezione','Nulla di rilevante']] },
  cute:{ e:'Cute e Annessi', r:[['Cute','Normocolorata, elastica, non lesioni evidenti'],['Mucose','Rosee e ben idratate']] },
  arti:{ e:'Arti e Polsi', r:[['Polsi periferici','Presenti e simmetrici'],['Edemi','Assenti']] }
};
const EO = (o={}) => {
  const out = {};
  for (const k in EO_BASE) {
    const b = EO_BASE[k], v = o[k];
    if (v && !Array.isArray(v)) { out[k] = v; continue; }
    const righe = v || b.r;
    out[k] = { etichetta:b.e, patologico:righe.some(r => r.length>2 && !r[2]), dettagli:righe.map(r => ({ parametro:r[0], esito:r[1], ok:!(r.length>2 && !r[2]) })) };
  }
  return out;
};

const CASI_CLINICI = [
{
  id: "case-001",
  titolo: "Dolore addominale acuto post-prandiale",
  descrizioneBreve: "Donna di 45 anni con dolore acuto in ipocondrio destro dopo una cena ricca di grassi, nausea e vomito.",
  difficolta: "Intermedio",
  specialita: "Gastroenterologia / Chirurgia Generale",
  schedaPaziente: {
    nome: "Maria Rossi", eta: 45, sesso: "F", motivo: "Dolore addominale acuto e vomito",
    parametriVitali: { PA: "125/80 mmHg", FC: "88 bpm", Temp: "37.4 °C", SpO2: "98% in aria ambiente", FR: "18 atti/min" }
  },
  anamnesi: Q(
    ["Cosa la porta oggi in pronto soccorso?", "Ho un forte dolore alla pancia in alto a destra, iniziato da qualche ora."],
    ["Quando e come è iniziato il dolore?", "Circa 2 ore dopo cena. È iniziato all'improvviso ed è diventato sempre più forte."],
    ["Che tipo di cena aveva fatto?", "Una cena abbondante a base di frittura di pesce e dolci."],
    ["Il dolore resta lì o si irradia?", "Mi fa male davanti a destra ma mi tira fino alla spalla e alla schiena."],
    ["Ha nausea o vomito?", "Sì, nausea ancora adesso. Ho vomitato una volta ma non mi è passato."],
    ["Ha mai avuto episodi simili in passato?", "Qualche volta un fastidio dopo mangiato, ma mai così forte e mai così a lungo."]
  ),
  esameObiettivo: EO({
    occhi: [["Sclere", "Lieve subittero sclerale", 0]],
    addome: [["Ispezione", "Addome piano"], ["Palpazione", "Dolorabilità marcata in ipocondrio destro. Segno di Murphy POSITIVO", 0]]
  }),
  esami: {
    laboratorio: [
      L("Emocromo Completo con Formula", "Analisi cellulare ematica", 2, "Leucocitosi con neutrofilia", "Vedi tabella", true, true, {
        pannello: [
          { id: 'wbc', val: 14.5, flag: 'H' },
          { id: 'neut', val: 82, flag: 'H' },
          { id: 'neut_abs', val: 11.89, flag: 'H' },
          { id: 'lymph', val: 12, flag: 'L' },
          { id: 'lymph_abs', val: 1.74, flag: '' },
          { id: 'mono', val: 5, flag: '' },
          { id: 'eos', val: 1, flag: '' },
          { id: 'baso', val: 0, flag: '' },
          { id: 'rbc', val: 4.45, flag: '' },
          { id: 'hgb', val: 13.2, flag: '' },
          { id: 'hct', val: 39.5, flag: '' },
          { id: 'mcv', val: 88, flag: '' },
          { id: 'plt', val: 260, flag: '' }
        ]
      }),
      L("Indici Infiammatori e Flogosi", "Proteina C Reattiva e indici siero-infiammatori", 2, "PCR elevata", "Vedi tabella", true, true, {
        pannello: [
          { id: 'pcr', val: 4.5, flag: 'H' },
          { id: 'ves', val: 38, flag: 'H' }
        ]
      }),
      L("Profilo Epatobiliare Completo", "Funzionalità epatobiliare", 3, "Bilirubina totale e transaminasi elevate", "Vedi tabella", true, false, {
        pannello: [
          { id: 'bilT', val: 2.8, flag: 'H' },
          { id: 'bilD', val: 2.1, flag: 'H' },
          { id: 'bilI', val: 0.7, flag: '' },
          { id: 'ast', val: 65, flag: 'H' },
          { id: 'alt', val: 78, flag: 'H' },
          { id: 'ggt', val: 145, flag: 'H' },
          { id: 'alp', val: 210, flag: 'H' }
        ]
      }),
      L("Profilo Biochimico e Enzimi Pancreatici", "Valutazione metabolica e pancreatica", 3, "Lipasi ed elettroliti nei limiti", "Vedi tabella", false, false, {
        pannello: [
          { id: 'lipasi', val: 35, flag: '' },
          { id: 'amilasi', val: 58, flag: '' },
          { id: 'gluc', val: 94, flag: '' },
          { id: 'creat', val: 0.85, flag: '' }
        ]
      })
    ],
    strumentali: [
      S("Ecografia addome superiore", "Esame ecografico diagnostico", 10, true, "eco", "Sospetta calcolosi biliare / colecistite", "Colecisti distesa, a pareti ispessite (> 4 mm) con segno del doppio binario. Presenza di calcoli multipli endoluminali con cono d'ombra posteriore. Lieve falda fluida pericolecistica. Vie biliari non dilatate."),
      S("RX Addome diretto", "Radiogramma addome in ortostatismo", 5, false, "rx", "Valutazione peritonismo / falda d'aria", "Assenza di aria libera sottodiaframmatica. Assenza di livelli idroaerei patologici.")
    ]
  },
  diagnosiDifferenziale: DX("Colecistite acuta litiasica", "Pancreatite acuta biliare", "Colica biliare semplice", "Ulcera peptica perforata"),
  spiegazioneClinica: "La presentazione con dolore in ipocondrio destro post-prandiale, segno di Murphy positivo, leucocitosi e riscontro ecografico di ispessimento di parete della colecisti con calcolosi orienta univocamente verso una Colecistite Acuta Litiasica. A differenza della colica biliare semplice il dolore persiste oltre 6 ore e si associa a flogosi sistemica. L'ecografia rappresenta l'esame di scelta di I livello; il trattamento è la colecistectomia laparoscopica precoce con copertura antibiotica."
},
{
  id: "case-002",
  titolo: "Dolore addominale migrante con febbricola",
  descrizioneBreve: "Ragazzo di 22 anni con dolore addominale iniziato attorno all'ombelico e spostatosi in basso a destra, inappetenza e nausea.",
  difficolta: "Facile",
  specialita: "Chirurgia Generale",
  schedaPaziente: { nome: "Luca Bianchi", eta: 22, sesso: "M", motivo: "Dolore addominale da 18 ore", parametriVitali: { PA: "120/75 mmHg", FC: "96 bpm", Temp: "37.9 °C", SpO2: "99% in aria ambiente", FR: "16 atti/min" } },
  anamnesi: Q(
    ["Cosa la porta oggi in pronto soccorso?", "Ho mal di pancia da ieri sera. Prima era attorno all'ombelico, adesso è in basso a destra."],
    ["Il dolore è cambiato di sede o di intensità?", "Sì, è diventato fisso e più forte. Se cammino o tossisco peggiora."],
    ["Ha appetito? Ha nausea o vomito?", "Non ho voglia di mangiare da ieri. Ho avuto nausea e ho vomitato una volta."],
    ["Com'è l'alvo? Diarrea o stitichezza?", "Non vado di corpo da due giorni, nessuna diarrea."],
    ["Ha avuto febbre?", "Ieri sera avevo 37.8, oggi circa 38."],
    ["Ha malattie note o interventi chirurgici pregressi?", "No, mai operato e sono sempre stato bene."],
    ["Ha sintomi urinari (bruciore, sangue)?", "No, urino normalmente."]
  ),
  esameObiettivo: EO({
    addome: [["Ispezione","Addome piano, ridotta mobilità respiratoria nei quadranti inferiori"],["Palpazione","Dolorabilità con difesa in fossa iliaca destra; Blumberg e McBurney POSITIVI",0],["Manovre","Segno di Rovsing positivo",0]]
  }),
  esami: {
    laboratorio: [
      L("Emocromo Completo con Formula","Emocromo e leucociti",2,"15.8 x10³/µL","Vedi tabella",true,true,{
        pannello:[{id:'wbc',val:15.8,flag:'H'},{id:'neut',val:82,flag:'H'},{id:'lymph',val:12,flag:'L'},{id:'hgb',val:14.5,flag:''},{id:'plt',val:280,flag:''}]
      }),
      L("Indici Infiammatori (PCR e VES)","Marker di flogosi sistemica",2,"PCR 6.8 mg/dL","Vedi tabella",true,true,{
        pannello:[{id:'pcr',val:6.8,flag:'H'},{id:'ves',val:42,flag:'H'}]
      }),
      L("Esame Chimico-Fisico e Microscopico Urine","Sedimento e stick urinario",2,"Nella norma","Vedi tabella",false,false,{
        pannello:[{id:'u_ph',val:6.0,flag:''},{id:'u_ps',val:1.018,flag:''},{id:'u_prot',val:0,flag:''},{id:'u_gluc',val:0,flag:''},{id:'u_leu',val:0,flag:''},{id:'u_nit',val:0,flag:''}]

'case-032': { d2:"L'artrosi erosiva colpisce le IFD; qui MCF e polsi simmetrici con sinovite e rigidità mattutina oltre un'ora.", d3:"Mancano psoriasi cutanea o ungueale, dattilite e coinvolgimento delle IFD; distribuzione simmetrica MCF-polsi.", d4:"Mancano rash malare, afte e fotosensibilità; la sinovite con erosioni radiografiche è tipica dell'AR." },
'case-033': { d2:"Ittero, ragnetti, flapping tremor e circoli collaterali con fegato ridotto e bozzuto: stigmate epatiche.", d3:"Il quadro è di scompenso con ascite e ipertensione portale su fegato cirrotico; non viene descritta una lesione focale.", d4:"Ascite con ittero, flapping e ragnetti, alcol per vent'anni e vena porta dilatata: ipertensione portale." },
'case-034': { d2:"Il fegato è sano; la causa è un'ulcera duodenale con vaso visibile (Forrest Ib).", d3:"Nessun vomito non ematico prima dell'ematemesi; dolore epigastrico da settimane che migliora mangiando, con uso cronico di FANS.", d4:"Dolore ciclico da settimane, migliorato dal cibo, con FANS e aspirina; l'EGDS mostra ulcera duodenale." },
'case-035': { d2:"Cicatrice sottombelicale, borborigmi con rumori metallici, dolore colico e brusco cambio di calibro alla TC indicano ostruzione meccanica.", d3:"Il dolore non è localizzato in fossa iliaca sinistra con febbre; la TC mostra dilatazione del tenue con punto di transizione.", d4:"Alvo chiuso a feci e gas con addome disteso e vomito fecaloide, non diarrea." },
'case-036': { d2:"L'ECG non mostra sopraslivellamento ST; il dolore è lacerante con irradiazione interscapolare e differenza di pressione tra gli arti.", d3:"Differenza di polsi e pressione, soffio diastolico e flap intimale all'eco; mancano ipossiemia e segni di sovraccarico destro.", d4:"Dolore lacerante con soffio di insufficienza aortica e asimmetria dei polsi, senza sfregamento pericardico." },
'case-037': { d2:"Esordio improvviso sollevando la spesa, apiretica (37.0), con sangue nelle cisterne alla TC.", d3:"È il peggior mal di testa della vita, massimo in pochi secondi, con rigidità nucale e paresi del III nervo.", d4:"La TC mostra iperdensità subaracnoidea; segni meningei e paresi del III nervo non sono spiegati da un ictus." },
'case-038': { d2:"Febbre altissima, ipotensione, petecchie ed ecchimosi non scomparenti: quadro meningococcico, più grave della forma virale.", d3:"Prevalgono segni meningei e rash purpurico; non c'è alterazione focale o crisi tipiche dell'encefalite erpetica.", d4:"Esordio progressivo con febbre 39.8 e petecchie, non cefalea fulminante; la TC non mostra sangue." },
'case-039': { d2:"C'è una vegetazione mobile con ascesso periannulare; la febbre reumatica dà pancardite e criteri di Jones, non vegetazioni.", d3:"La vegetazione è su valvola aortica bicuspide con soffio di nuova insorgenza dopo estrazione dentaria; il mixoma è una massa atriale.", d4:"Mancano segni di lupus; febbre con emorragie a scheggia, noduli di Osler, splenomegalia ed estrazione dentaria senza copertura indicano endocardite." },
'case-040': { d2:"Riflessi aboliti, paresi simmetrica progressiva dopo gastroenterite e blocchi di conduzione; la miastenia ha affaticabilità fluttuante con riflessi conservati.", d3:"Tetraparesi flaccida con areflessia, paresi facciale e RM midollare normale; la mielite dà livello sensitivo e disturbi sfinterici.", d4:"Qui progressione in quattro giorni con paresi facciale e alterazioni della conduzione: neuropatia, non un episodio parossistico da potassio." },
'case-041': { d2:"Deficit fluttuante con peggioramento serale, ptosi e diplopia, decremento >15% alla stimolazione ripetitiva e timoma: non è SM.", d3:"Nel Lambert-Eaton c'è incremento ad alta frequenza, riflessi ridotti e disautonomia; qui ptosi e diplopia con decremento.", d4:"Non ci sono esoftalmo né segni tiroidei: c'è ptosi (non retrazione palpebrale), debolezza fluttuante e timoma." },
'case-042': { d2:"Rash malare, sierosite, afte, Raynaud e proteinuria con nefrite classe IV: oltre l'artrite dell'AR.", d3:"Ci sono manifestazioni sistemiche (rash, artrite, sierosite, Raynaud) e la biopsia mostra depositi full-house.", d4:"Rash malare senza papule di Gottron né debolezza prossimale; nefrite e sierosite indicano LES." },
'case-043': { d2:"Iperpigmentazione cutaneo-mucosa, ipotensione, T appuntite all'ECG e surreni atrofici indicano insufficienza surrenalica.", d3:"Tachicardia (118) e febbre al posto di bradicardia e ipotermia; iperpigmentazione e T alte.", d4:"Ipotensione marcata con iperpigmentazione, calo ponderale e desiderio di sale; non c'è diarrea." },
'case-044': { d2:"Crisi parossistiche con pallore, sudorazione e ipertensione e massa surrenalica captante MIBG; nell'ipertiroidismo i sintomi sono continui.", d3:"L'iperaldosteronismo dà ipertensione stabile con ipokaliemia, senza attacchi; qui crisi con pallore e massa captante MIBG.", d4:"Le crisi hanno ipertensione 210/120, pallore e massa surrenalica con MIBG: il panico non produce questi reperti." },
'case-045': { d2:"Le lesioni sono osteolitiche a stampo (non osteoaddensanti) con picco monoclonale IgG-kappa e plasmacellule al 55%.", d3:"Plasmacellule ≥10% con danno d'organo (lesioni litiche, anemia, insufficienza renale): non è una MGUS.", d4:"Dolore notturno, ecchimosi, anemia e picco monoclonale con multiple lesioni osteolitiche." },
'case-046': { d2:"Quadro acuto di tre settimane con blasti >60% e bastoncelli di Auer (MPO+): non è una linfocitosi matura.", d3:"Pancitopenia con blasti, petecchie e dolore osseo; non ci sono linfociti atipici.", d4:"Oltre alla piastrinopenia ci sono anemia, neutropenia e blasti: l'ITP è isolata." },
'case-047': { d2:"C'è anemia emolitica con schistociti, febbre, sintomi neurologici e ADAMTS13 gravemente ridotta; nell'ITP la piastrinopenia è isolata.", d3:"Nella CID PT, aPTT e fibrinogeno sono alterati, nella TTP sono normali.", d4:"Nessuna diarrea sanguinolenta recente; prevalgono i sintomi neurologici con ADAMTS13 gravemente ridotta." },
'case-048': { d2:"Ipotensione e shock con massa pulsatile, AAA all'eco e polsi femorali ridotti: la colica non dà shock.", d3:"Massa pulsatile dolente con ecchimosi al fianco e instabilità emodinamica; l'eco mostra AAA con ematoma retroperitoneale.", d4:"Dolore improvviso addomino-lombare con massa pulsatile; l'angio-TC mostra rottura contenuta dell'AAA, non occlusione mesenterica." },
'case-049': { d2:"31 anni, non fumatore, con febbricola, sudorazioni, emoftoe e contatto con TBC; cavità con infiltrati satelliti e tree-in-bud.", d3:"Sintomi da due mesi con cavità apicale e tree-in-bud e contatto con un caso di TBC.", d4:"Cavitazione apicale con sintomi sistemici (febbre, sudorazione, 9 kg persi) e contatto con TBC; la sarcoidosi dà adenopatie ilari bilaterali." },
'case-050': { d2:"Infiltrati interstiziali perilari con vetro smerigliato e cisti e desaturazione da sforzo; la miliare dà micronoduli diffusi.", d3:"Esordio subacuto di tre settimane con tosse secca e infiltrati bilaterali simmetrici, non un consolidamento lobare.", d4:"Febbre, candidosi orale e infiltrati diffusi bilaterali in immunodepresso: mancano dolore pleurico e fattori di rischio tromboembolico." },
'case-051': { d2:"Giovane senza fattori di rischio tromboembolico né edemi, con iperfonesi e murmure abolito da un lato: segni di aria nella pleura, non di un'ostruzione vascolare.", d3:"È apiretico e senza catarro; nella polmonite si avrebbero ipofonesi e soffio bronchiale, non iperfonesi con murmure abolito.", d4:"Il dolore è pleuritico e unilaterale, senza sfregamento né alterazioni ECG; l'esame del torace indica un pneumotorace." },
'case-052': { d2:"Nel Crohn ci sono dolore in fossa iliaca destra, febbre, fistole, sangue o muco; qui steatorrea con atrofia dei villi duodenali e anti-tTG molto elevati.", d3:"L'intolleranza al lattosio non causa anemia, afte, dermatite erpetiforme né atrofia dei villi.", d4:"La sindrome dell'intestino irritabile non dà calo ponderale, anemia o malassorbimento e ha esami normali." },
'case-053': { d2:"Il dolore dura pochi minuti, è sempre scatenato dallo sforzo e passa a riposo; la troponina è normale e l'ECG a riposo privo di alterazioni.", d3:"Il dolore è scatenato dallo sforzo e passa con la nitroglicerina; non è post-prandiale e non peggiora da sdraiati.", d4:"Compare solo con lo sforzo, è costrittivo e si irradia a braccio e mandibola: non è un dolore parietale." },
'case-054': { d2:"Il sopraslivellamento ST è diffuso e concavo con depressione del PR; la troponina è normale e il dolore non è da sforzo.", d3:"Mancano fattori di rischio e ipossiemia; lo sfregamento pericardico, la posizione antalgica e l'ECG diffuso indicano il pericardio.", d4:"Il dolore migliora piegandosi in avanti e c'è versamento pericardico con alterazioni ECG diffuse; lo sfregamento è pericardico." },
'case-055': { d2:"Nella nefropatia a IgA l'ematuria compare insieme all'infezione, con C3 normale; qui due-tre settimane dopo, con TAS alto e C3 basso.", d3:"Nella sindrome nefrosica prevale la proteinuria massiva senza ematuria né ipertensione e con C3 normale; qui sindrome nefritica.", d4:"Mancano febbre, dolore al fianco e disuria; il sedimento mostra emazie dismorfiche e cilindri eritrocitari, non leucociti." },
'case-056': { d2:"Nelle forme paraneoplastiche il PTH è soppresso; qui è elevato in modo inappropriato con adenoma all'ecografia.", d3:"Nella sarcoidosi il PTH è soppresso e c'è coinvolgimento polmonare; qui PTH alto con vitamina D bassa.", d4:"Non assume integratori; la 25-OH vitamina D è bassa e il PTH elevato (nell'intossicazione sarebbe soppresso)." },
'case-057': { d2:"Nell'ictus la fronte è risparmiata e ci sono deficit agli arti; qui paralisi dell'emivolto completa, fronte compresa, senza deficit motori.", d3:"Mancano le vescicole nel condotto uditivo e sul padiglione; il dolore retroauricolare è isolato.", d4:"Nessuna puntura di zecca né eritema migrante; la sierologia è negativa e il quadro è unilaterale e isolato." },
'case-058': { d2:"Mancano cefalea temporale, disturbi visivi e claudicazione masticatoria; le arterie temporali sono normali alla palpazione e all'ecografia.", d3:"Non c'è sinovite delle piccole articolazioni e il fattore reumatoide è negativo; dolore e rigidità sono dei cingoli.", d4:"Nella polimiosite la forza è ridotta e la CK elevata; qui forza conservata e CK normale." },
'case-059': { d2:"L'asma non spiega orticaria, angioedema e ipotensione, né l'esordio pochi minuti dopo la puntura.", d3:"L'angioedema ereditario non dà orticaria né prurito e non segue una puntura di imenottero; qui orticaria generalizzata.", d4:"La sincope vasovagale ha bradicardia e pallore, senza orticaria, stridore o broncospasmo; qui tachicardia con segni cutanei e respiratori." },
'case-060': { d2:"Mancano diarrea e vomito persistenti; la cefalea con confusione, il coinvolgimento dell'intera famiglia e la stufa a gas indicano un'esposizione ambientale.", d3:"Colpisce più persone insieme, senza aura e con una fonte di combustione in ambiente chiuso; COHb 28%.", d4:"Mancano febbre, tosse e dolori muscolari; i sintomi migliorano fuori casa." },
'case-061': { d2:"Nell'embolia massiva non c'è versamento pericardico con collasso delle camere destre; qui polso paradosso, toni ovattati e bassi voltaggi.", d3:"Mancano ortopnea con edema polmonare e disfunzione sistolica; qui funzione sistolica conservata con collasso delle camere destre.", d4:"È cronica, con calcificazioni pericardiche; qui un versamento acuto di 22 mm con tamponamento." },
'case-062': { d2:"Non ha mai assunto cortisone e l'ACTH è elevato, mentre nella forma iatrogena è soppresso.", d3:"Irsutismo e oligomenorrea ci sono, ma il mancato freno col desametasone, le smagliature larghe, l'ipostenia prossimale e la facies lunare indicano ipercortisolismo.", d4:"L'ACTH è elevato (non soppresso) e la RM mostra un adenoma ipofisario; i surreni sono iperplastici, senza massa." },
'case-063': { d2:"Nella tubercolosi ci sono necrosi caseosa, adenopatie asimmetriche e sintomi più marcati; qui granulomi non caseosi con adenopatie ilari simmetriche.", d3:"Il Hodgkin ha adenopatie indolenti progressive con sintomi B; eritema nodoso, artrite delle caviglie e uveite sono tipici della sarcoidosi.", d4:"Non spiega eritema nodoso, uveite e adenopatie ilari bilaterali; l'RX non mostra infiltrati parenchimali." },
'case-064': { d2:"L'infezione è il fattore scatenante ma non spiega gozzo, esoftalmo, tremore, calo ponderale e TSH soppresso con ormoni liberi altissimi.", d3:"Il TSH è soppresso con fT4 e fT3 molto elevati e c'è gozzo con esoftalmo; nel feocromocitoma la funzione tiroidea è normale.", d4:"Segue l'esposizione ad anestetici con rigidità muscolare e CK elevata; qui Basedow sospeso con TSH soppresso." },
'case-065': { d2:"Il non Hodgkin ha spesso interessamento extranodale e adenopatie non contigue; qui catene contigue con istologia a cellule di Reed-Sternberg.", d3:"La tubercolosi linfonodale ha linfonodi colliquati con contatti e Mantoux positiva; qui adenopatia dura-elastica e istologia di Hodgkin.", d4:"La mononucleosi dà tonsillite, adenopatie dolenti e linfocitosi atipica; qui linfopenia, prurito, dolore dopo alcol e istologia di linfoma." },
'case-066': { d2:"La colecistite non causa ittero con coledoco dilatato e colestasi; qui coledoco di 13 mm con calcolo, ipotensione e confusione.", d3:"Nell'epatite le transaminasi superano di molto i valori della colestasi e le vie biliari non sono dilatate; qui GGT elevata, febbre e calcolo nel coledoco.", d4:"L'ittero è indolore e progressivo, senza febbre né brividi; qui dolore con febbre alta, leucocitosi e calcolo." },
'case-067': { d2:"Ha flapping tremor e segni di epatopatia senza oftalmoplegia; qui oftalmoplegia, nistagmo e atassia con lesioni talamiche e dei corpi mammillari.", d3:"Compare con agitazione e iperattività autonomica 48-96 ore dopo l'ultimo bicchiere; qui oftalmoplegia, atassia e malnutrizione con tiamina bassa.", d4:"Dà deficit asimmetrici ad esordio improvviso; qui sintomi simmetrici con lesioni simmetriche di talami e corpi mammillari." },
'case-068': { d2:"Ha lesioni midollari longitudinali estese e anticorpi anti-AQP4; qui lesioni cerebrali tipiche della SM e bande oligoclonali.", d3:"Colpisce dopo i 50 anni con cefalea temporale e VES molto elevata; qui giovane con RM e bande oligoclonali.", d4:"Ha occhio rosso con dolore intenso, cornea edematosa e midriasi; qui occhio bianco con difetto pupillare afferente e papilla normale." },
'case-069': { d2:"Il dolore è sproporzionato con compartimenti tesi non compressibili e deficit neurovascolare; qui compartimenti compressibili senza deficit, con mioglobinuria e CK altissima.", d3:"Ha febbre e infezione prodromica con CK meno elevata; qui sforzo estremo con CK 48.500, mioglobinuria e insufficienza renale.", d4:"Ha ematuria glomerulare con emazie dismorfiche, ipertensione e proteinuria; qui emoglobina senza emazie (mioglobinuria) e CK altissima." },
'case-070': { d2:"Non causa shock con lattati elevati e piastrinopenia; qui idronefrosi con calcolo ostruente e sepsi da E. coli ESBL con catetere.", d3:"Ha giugulari turgide, edemi e polmoni congesti; qui cute fredda, febbre alta, leucocitosi, piastrinopenia e fonte urinaria.", d4:"Non spiega piuria, nitriti positivi, dolore al fianco e febbre alta con batteriemia." },
'case-071': { d2:"Nella stenosi lombare il dolore compare camminando (claudicazione neurogena) e migliora piegandosi in avanti; qui peggiora da seduto e piegato, con Lasègue positivo.", d3:"Mancano ritenzione urinaria, anestesia a sella e deficit motorio bilaterale progressivo; sfinteri normali e forza conservata.", d4:"Nel piriforme il dolore è glutaeo con Lasègue negativo e senza deficit radicolari; qui riflesso achilleo ridotto e ipoestesia S1 con ernia alla RM." },
'case-072': { d2:"Nella rinite allergica la secrezione è chiara, con prurito e starnuti, senza febbre né dolore facciale monolaterale.", d3:"Nel raffreddore i sintomi regrediscono entro 7-10 giorni; qui persistono con peggioramento, secrezione purulenta, dolore facciale e febbre.", d4:"La cefalea a grappolo è periorbitaria, di breve durata, con lacrimazione e agitazione, senza rinorrea purulenta né febbre." },
'case-073': { d2:"Nel reflusso il bruciore è retrosternale e post-prandiale, peggiora da sdraiati; qui epigastrico, a digiuno e notturno, migliorato dal cibo.", d3:"Mancano dolore a barra verso la schiena, steatorrea e abuso di alcol importante; l'endoscopia mostra un'ulcera.", d4:"Nella dispepsia funzionale l'endoscopia è normale; qui ulcera duodenale con H. pylori alle biopsie." },
'case-074': { d2:"Nella distorsione di grado II non c'è dolorabilità ossea sui malleoli e il paziente riesce a caricare; qui l'RX mostra la frattura.", d3:"Nella rottura dell'Achille il dolore è posteriore, con segno di Thompson positivo e impossibilità a flettere il piede; qui dolore malleolare.", d4:"Nella frattura del V metatarso il dolore è sul bordo laterale del piede, non sui malleoli, e l'RX mostra la frattura del perone." },
'case-075': { d2:"La chetoacidosi ha iperglicemia, poliuria e respiro di Kussmaul; qui glicemia 38 mg/dL dopo insulina, digiuno e sforzo.", d3:"L'attacco di panico ha glicemia normale e non migliora col glucosio; qui sintomi con triade di Whipple.", d4:"La crisi epilettica non spiega sudore freddo e fame con glicemia 38 mg/dL; qui sintomi adrenergici e neuroglicopenici reversibili con glucosio." },
'case-076': { d2:"L'epatite B ha sierologia positiva per HBsAg e IgM anti-HBc; qui HBsAg negativo e IgM anti-HAV positive con ingestione di molluschi crudi.", d3:"Nella colecistite c'è dolore in ipocondrio destro con colestasi e Murphy positivo, non transaminasi di migliaia; qui vie biliari non dilatate.", d4:"La mononucleosi ha tonsillite, adenopatie e linfocitosi atipica con transaminasi più modeste; qui ittero con transaminasi > 1.800 e IgM anti-HAV positive." },
'case-077': { d2:"Nella necrosi tubulare il FeNa è > 2% con cilindri granulari; qui FeNa 0.4%, urine concentrate e sedimento privo di cilindri.", d3:"Nell'ostruzione ci sono idronefrosi o globo vescicale all'ecografia; qui reni normali e vescica vuota.", d4:"Nella glomerulonefrite c'è ematuria glomerulare con cilindri eritrocitari e proteinuria; qui sedimento bland e causa prerenale evidente." },
'case-078': { d2:"Nella gotta la febbre è meno alta, il liquido è giallo-torbido con cristalli di urato; qui pus con cocchi Gram-positivi e coltura per S. aureus.", d3:"L'artrite reattiva segue un'infezione intestinale o uretrale con altre manifestazioni; qui liquido purulento con germi.", d4:"L'artrosi riacutizzata non ha febbre alta, leucocitosi né liquido con 85.000 globuli bianchi." },
'case-079': { d2:"La post-streptococcica è una sindrome nefritica con ematuria, ipertensione e C3 basso; qui proteinuria massiva senza emazie e normotensione.", d3:"Nello scompenso cardiaco i giugulari sono turgide e la proteinuria assente; qui proteinuria di 8.2 g/24 h con ipoalbuminemia.", d4:"Nella cirrosi mancano proteinuria massiva e dislipidemia, e ci sono segni epatici (ragnetti, splenomegalia, ipertensione portale)." },
'case-080': { d2:"Nell'ictus il deficit persiste; qui sintomi risolti in dieci minuti e RM senza restrizione della diffusione.", d3:"L'emicrania con aura ha sintomi positivi che si propagano e cefalea; qui deficit negativi (debolezza, afasia) e soffio carotideo.", d4:"Le crisi focali hanno sintomi positivi (scosse, clonie) e spesso un periodo post-critico; qui deficit di forza con stenosi carotidea del 75%." },
'case-081': { d2:"Nella leucemia ci sono blasti circolanti o midollari e spesso splenomegalia; qui midollo ipocellulare senza blasti né fibrosi.", d3:"Nella mielodisplasia il midollo è ipercellulare con displasia e cariotipo spesso alterato; qui cellularità 5% e cariotipo normale.", d4:"La porpora trombocitopenica immune è limitata alle piastrine, con megacariociti aumentati; qui pancitopenia con reticolociti bassi." },
'case-082': { d2:"Nell'ipertensione essenziale la kaliemia è normale e la renina non è soppressa; qui ipokaliemia e rapporto aldosterone/renina 190.", d3:"Il feocromocitoma dà crisi con sudore, cefalea e pallore e catecolamine elevate; qui ipertensione stabile con ipokaliemia e renina soppressa.", d4:"Nella stenosi dell'arteria renale la renina è elevata (iperaldosteronismo secondario); qui renina soppressa e adenoma surrenalico." },
'case-083': { d2:"Nell'epatite virale manca l'esposizione a una dose epatotossica; qui paracetamolemia 85 µg/mL a 14 ore e AST/ALT di migliaia con andamento tipico.", d3:"Nell'epatite alcolica le AST superano le ALT ma restano < 300-500 U/L, con GGT molto elevata; qui transaminasi di migliaia e paracetamolo alto.", d4:"Nella colecistite c'è colestasi e febbre alta con Murphy positivo; qui necrosi epatocellulare con INR 2.4 e ipoglicemia." },
'case-084': { d2:"La granulomatosi con poliangioite ha ANCA positivi (PR3), sintomi delle vie aeree superiori e granulomi; qui anti-GBM positivi e ANCA negativi.", d3:"Il lupus ha ANA/anti-dsDNA e C3 bassi con altre manifestazioni (rash, artrite); qui nessun segno sistemico e depositi lineari di IgG.", d4:"La legionella dà polmonite lobare con febbre alta, iponatriemia e sintomi gastrointestinali; qui infiltrati alveolari simmetrici, ematuria dismorfica e anti-GBM." },
'case-085': { d2:"La polmonite da ipersensibilità cronica ha esposizione ad antigeni, vetro smerigliato e perfusione a mosaico; qui nessuna esposizione e pattern UIP tipico.", d3:"Lo scompenso ha edemi, giugulari turgide e BNP elevato; qui crepitii a velcro, ippocratismo e restrizione con DLCO ridotta.", d4:"Nella BPCO enfisematosa il quadro è ostruttivo (FEV1/FVC ridotto) con iperinflazione; qui FEV1/FVC 0.84 e fibrosi basale subpleurica." }

      if (k = n(/[Ee]mazie\s*(\+{1,4})/)) put('u_emaz', [0,30,80,200,300][k]);
      if (k = n(/Glicosuria\s*(\+{1,4})/)) put('u_gluc', [0,50,150,500,1000][k]);
      if (k = n(/chetonuria\s*(\+{1,4})/)) put('u_chet', [0,15,40,80,150][k]);
      if (/nitriti\s*(positivi|\+)/i.test(t)) put('u_nit', 1);
      const pr = t.match(/Proteinuria\s*([\d.,]+)\s*g/); if (pr) put('u_prot', Math.round(labNum(pr[1]) * 80));
      if (/ematuria/i.test(t)) put('u_emaz', 150);
    }
    if (/Aldosterone ridotto/i.test(t)) put('aldo', 12);
    const ids = Object.keys(got), isUr = /urin/i.test(it.nome);
    if (isUr && it.essenziale) ess.urine = true;
    if (it.patologico === false) ids.forEach(id => noFlag.add(id));
    ids.forEach(id => { if (!(id in V)) V[id] = got[id]; const c = catDi[id]; if (c && it.essenziale) ess[c] = true; });
    if (isUr && /sedimento|cilindri/i.test(t)) urineExtra.push({ nome:'Sedimento urinario', esito:(t.match(/cilindri[^;]*/i) || [''])[0], patologico:true, essenziale:!!it.essenziale });
    if (!ids.length && !isUr) { speciali.push(it); return; }
    if (!LAB_DUAL.test(it.nome)) return;
    /* esame misto: nei pannelli resta ciò che contengono, a parte solo il test non coperto */
    const SEGM = /striscio/i.test(it.nome) ? /schistociti|rouleaux|striscio/i : /proteinuria/i.test(it.nome) && /24 ore/i.test(it.nome) ? /24 h|24 ore/i : /INR|aPTT|\bPT\b|fibrinogeno/i.test(it.nome) && /^(Bilirubina, albumina e INR|Coagulazione \(PT, aPTT, fibrinogeno, D-dimero\))$/.test(it.nome) ? /INR|aPTT|\bPT\b|fibrinogeno/i : null;
    if (!SEGM) { speciali.push(it); return; }
    const sp = x => String(x || '').split(/;\s*/), E = sp(it.esito), Rn = sp(it.rangeNormale);
    const idx = E.map((x, i) => SEGM.test(x) || (SEGM.test(Rn[i] || '') ? 1 : 0) ? i : -1).filter(i => i >= 0);
    if (!idx.length) return;
    const nomeRes = /striscio/i.test(it.nome) ? 'Striscio periferico' : /proteinuria/i.test(it.nome) ? 'Proteinuria delle 24 ore' : /^Bilirubina/.test(it.nome) ? 'PT / INR' : 'Coagulazione (PT, aPTT, fibrinogeno)';
    const descRes = /striscio/i.test(it.nome) ? 'Esame morfologico dei globuli' : /24 ore/i.test(it.nome) ? 'Funzione glomerulare' : 'Coagulazione';
    speciali.push({ ...it, nome:nomeRes, desc:descRes, id:'lab-' + slug(nomeRes) + '-' + caso.id, esito:idx.map(i => E[i]).join('; '), rangeNormale:idx.map(i => Rn[i] || '').filter(Boolean).join('; ') || 'Assenti' });
  });
  String(LAB_EXTRA[caso.id] || '').split(',').filter(Boolean).forEach(kv => { const [id, v] = kv.split('='); if (!(id in V)) V[id] = +v; });
  const meta = id => PL[id] || { name:id, unit:'', dec:1 };
  const rif = id => { const m = meta(id); return m.ref || (sesso === 'F' ? m.refF : m.refM) || [0, 0]; };
  const nr = id => { const [lo, hi] = rif(id); return hi <= lo ? 0 : lo === 0 ? hi * (0.1 + 0.4 * rng()) : lo + (hi - lo) * (0.3 + 0.4 * rng()); };
  const DER = ['hct','rbc','mch','mchc','neut','lymph','neut_abs','lymph_abs','mono_abs','eos_abs','baso_abs','bilI','egfr'];
  const dati = new Set(Object.keys(V));
  LAB_CATS.forEach(c => c.ids.forEach(id => { if (!(id in V) && !DER.includes(id)) V[id] = nr(id); }));
  const dv = (id, f) => { if (!(id in V)) V[id] = f(); };
  dv('neut', () => dati.has('lymph') ? Math.max(0, 100 - V.lymph - 7) : nr('neut'));
  dv('lymph', () => dati.has('neut') ? Math.max(3, 100 - V.neut - 7) : nr('lymph'));
  const emIn = ['hgb', 'hct', 'mcv'].some(i => dati.has(i)), fuori = (i, x) => x < rif(i)[0] || x > rif(i)[1];
  const abn = ['hgb', 'hct', 'mcv', 'rbc'].some(i => dati.has(i) && fuori(i, V[i]));
  const gd = (id, x) => (!abn && fuori(id, x)) ? nr(id) : x;
  dv('hct', () => dati.has('hgb') ? gd('hct', V.hgb * 3) : nr('hct'));
  dv('rbc', () => emIn ? gd('rbc', V.hct * 10 / V.mcv) : nr('rbc'));
  dv('mch', () => emIn ? gd('mch', V.hgb * 10 / V.rbc) : nr('mch'));
  dv('mchc', () => emIn ? gd('mchc', V.hgb / V.hct * 100) : nr('mchc'));
  [['neut_abs','neut'],['lymph_abs','lymph'],['mono_abs','mono'],['eos_abs','eos'],['baso_abs','baso']].forEach(([a, p]) => dv(a, () => dati.has(p) && dati.has('wbc') ? V.wbc * V[p] / 100 : nr(a)));
  dv('bilI', () => (dati.has('bilT') || dati.has('bilD')) ? Math.max(0, V.bilT - V.bilD) : nr('bilI'));
  dv('egfr', () => V.creat <= rif('creat')[1] ? nr('egfr') : Math.min(120, Math.round(85 / V.creat)));
  const riga = id => { const [lo, hi] = rif(id), v = +(+V[id]).toFixed(meta(id).dec ?? 1); return { id, val:v, flag: noFlag.has(id) ? '' : v < lo ? 'L' : v > hi ? 'H' : '' }; };
  const pannelli = LAB_CATS.map(c => {
    const righe = c.ids.map(riga), ex = c.k === 'urine' ? urineExtra : [];
    return { id:'lab-pan-' + c.k, nome:c.nome, desc:`${righe.length} parametri`, costo:c.costo + (ex.length ? 1 : 0),
      essenziale: !!ess[c.k] || ex.some(e => e.essenziale), patologico: righe.some(r => r.flag) || ex.some(e => e.patologico),
      esito:'', rangeNormale:'', pannello:righe, pannelloCat:c.k, extra:ex.map(e => ({ nome:e.nome, esito:e.esito, patologico:!!e.patologico })) };
  });
  return [...pannelli, ...speciali];
}

function filtraCasi() {
  const q = ui.search.trim().toLowerCase();
  return CASI.filter(c => {
    const st = progress.casi[c.id];
    if (ui.spec && !tagsSpec(c).includes(ui.spec)) return false;
    if (ui.diff && c.difficolta !== ui.diff) return false;
    if (ui.stato === 'completato' && !(st && st.completato)) return false;
    if (ui.stato === 'da-svolgere' && st && st.completato) return false;
    if (ui.stato === 'da-ripassare' && !daRipassare(c)) return false;
    if (q) {
      const dxOk = st && st.completato ? (c.diagnosiDifferenziale.find(d => d.corretta) || {}).testo : '';
      const hay = [c.titolo, c.descrizioneBreve, c.specialita, c.schedaPaziente.motivo, dxOk].join(' ').toLowerCase();
      return q.split(/\s+/).every(w => hay.includes(w));
    }
    return true;
  });
}

  };
  
  /* ---------- Helper Generazione Tabella Laboratorio ---------- */
  function generaTabellaLaboratorio(pannello, sessoPaziente = 'M') {
    if (!pannello || !pannello.length) return '';
    const rows = pannello.map(item => {
      const meta = PARAMS_LAB[item.id] || { name: item.id, unit: '', dec: 1 };
      const ref = meta.ref || (sessoPaziente === 'F' ? meta.refF : meta.refM);
      const qual = LAB_QUAL.has(item.id);
      const refTxt = qual ? 'Negativo' : ref ? (ref[0] === 0 && ref[1] === 0 ? 'Assente' : `${ref[0]} – ${ref[1]}`) : '—';
      const valFmt = qual ? (item.val ? 'Positivo' : 'Negativo') : Number(item.val).toFixed(meta.dec !== undefined ? meta.dec : 1);
      const col = item.flag === 'H' ? 'text-red-600' : item.flag === 'L' ? 'text-blue-600' : 'text-slate-800';
      const badge = item.flag ? `<span class="ml-1.5 text-[10px] px-1 rounded font-sans font-extrabold ${item.flag === 'H' ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'}">${item.flag}</span>` : '';
      return `<tr class="border-b border-slate-100 ${item.flag ? 'bg-red-50/40' : ''}">
        <td class="py-1.5 px-2.5 text-xs font-medium text-slate-800">${esc(meta.name)}</td>
        <td class="py-1.5 px-2.5 text-xs font-mono font-semibold whitespace-nowrap ${col}">${valFmt}${badge}</td>
        <td class="py-1.5 px-2.5 text-[11px] text-slate-500 whitespace-nowrap">${esc(meta.unit || '—')}</td>
        <td class="py-1.5 px-2.5 text-[11px] text-slate-500 whitespace-nowrap">${refTxt}</td></tr>`;
    }).join('');
    return `<div class="overflow-x-auto scroll-thin"><table class="w-full border-collapse bg-white rounded-lg overflow-hidden border border-slate-200 text-left">
      <thead><tr class="bg-slate-100 border-b border-slate-300 text-[10px] text-slate-600 uppercase"><th class="py-1.5 px-2.5">Parametro</th><th class="py-1.5 px-2.5">Esito</th><th class="py-1.5 px-2.5">Unità</th><th class="py-1.5 px-2.5">Valori Rif.</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }

  const x2 = a => a.map(e => ({ ...e, costo:(+e.costo || 0) * 2 }));
  const casoConGenerali = { ...caso, anamnesi: costruisciAnamnesi(caso), esami: { ...caso.esami, laboratorio: x2(costruisciLab(caso, PARAMS_LAB)), strumentali: x2(caso.esami.strumentali || []) } };

  G = {
    caso: casoConGenerali, tab:'anamnesi', sub:'obiettivo',
    chat:[
      { from:'sys', text:`${sessoTxt(s.sesso)} di ${s.eta} anni · ${s.motivo}` },
      { from:'sys', text:'Usa «Fai una domanda»: scegli tu cosa indagare (attuale, apparati, remota, farmaci, famiglia…).' }
    ],
    poste:new Set(), esaminati:new Set(), prescritti:[],
    opzioni:shuffle(caso.diagnosiDifferenziale), scelta:null, finito:false, typing:false, filtroDomande:'', catDomande:''
  };
  G.generaTabellaLaboratorio = generaTabellaLaboratorio;
  renderGame();
}

function renderGame() {
  const c = G.caso;
  app.innerHTML = `

    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200">

function renderBudget() {
  const el = $('#budget'); if (!el || !G) return;
  const p = 100 - costoTotale();
  const col = p >= 70 ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : p >= 40 ? 'bg-amber-50 text-amber-700 border-amber-200' : 'bg-red-50 text-red-700 border-red-200';
  el.className = `flex items-center gap-1.5 border rounded-full px-3 py-1.5 text-sm font-bold flex-none ${col}`;
  el.innerHTML = `${icon('coins','w-4 h-4')}<span class="tabular-nums">${p}</span><span class="text-[10px] font-semibold opacity-70 hidden sm:inline">PUNTI</span>`;
  refreshIcons();
}

function renderStepper() {
  const el = $('#stepper'); if (!el || !G) return;
  const nEsami = G.esaminati.size + G.prescritti.length;
  const steps = [
    { k:'anamnesi', n:1, l:'Anamnesi', info:`${G.poste.size}` },
    { k:'esami', n:2, l:'Esami', info:`${nEsami} eseguiti` },
    { k:'diagnosi', n:3, l:'Diagnosi', info:G.scelta ? 'scelta' : '' }
  ];
  const idx = steps.findIndex(s => s.k === G.tab);
  el.innerHTML = `<div class="max-w-5xl mx-auto px-4 pb-3"><div class="flex items-center">` + steps.map((s, i) => {
    const attivo = i === idx, passato = i < idx;
    return `${i > 0 ? `<div class="flex-1 h-0.5 mx-1.5 rounded ${i <= idx ? 'bg-blue-600' : 'bg-slate-200'}"></div>` : ''}
      <button data-action="tab" data-tab="${s.k}" class="flex items-center gap-2 rounded-full pl-1 pr-3 py-1 border transition ${attivo ? 'bg-blue-600 text-white border-blue-600 shadow-md shadow-blue-600/25' : 'bg-white text-slate-600 border-slate-200 hover:border-blue-300'}">
        <span class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold ${attivo ? 'bg-white/20' : passato ? 'bg-blue-100 text-blue-700' : 'bg-slate-100'}">${passato ? icon('check','w-4 h-4') : s.n}</span>
        <span class="text-sm font-semibold">${s.l}</span>
        <span class="hidden sm:inline text-[11px] opacity-75">${s.info}</span>
      </button>`;
  }).join('') + `</div></div>`;
  refreshIcons();
}

function setTab(tab) {
  if (!G) return;
  G.tab = tab; renderStepper(); renderTab();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function renderTab() {
  const b = $('#game-body'); if (!b || !G) return;
  if (G.tab === 'anamnesi') { b.innerHTML = htmlAnamnesi(); renderChat(); renderListaDomande(); }
  else if (G.tab === 'esami') b.innerHTML = htmlEsami();
  else b.innerHTML = htmlDiagnosi();
  refreshIcons();
}

function renderListaDomande() {
  const el = $('#lista-domande'); if (!el) return;
  const q = (G.filtroDomande || '').trim().toLowerCase(), cat = G.catDomande || '';
  const vis = G.caso.anamnesi.filter(d => d.cat !== 'app' || G.poste.size >= d.sblocco);
  const chip = (k, n) => `<button class="flex-none text-xs font-semibold px-3 py-1.5 rounded-full border transition ${cat === k ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-100'}" data-action="cat-dom" data-cat="${k}">${n}</button>`;
  const chips = $('#chips-cat');
  if (chips) chips.innerHTML = chip('', 'Tutte') + CAT_ANAM.filter(c => vis.some(d => d.cat === c.k)).map(c => chip(c.k, c.n)).join('');
  const lista = vis.filter(d => (!cat || d.cat === cat) && d.domanda.toLowerCase().includes(q));
  if (!lista.length) { el.innerHTML = `<li class="text-center text-sm text-slate-500 py-6">Nessuna domanda corrisponde alla ricerca.</li>`; return; }
  const itemHtml = d => {
    const posta = G.poste.has(d.id);
    return `<li><button class="q-item" data-action="chiedi" data-id="${esc(d.id)}" ${posta ? 'disabled' : ''}>
      <span class="${posta ? 'text-emerald-500' : 'text-blue-600'} flex-none">${icon(posta ? 'check-circle-2' : 'message-circle','w-5 h-5')}</span>
      <span class="flex-1">${esc(d.domanda)}</span>${posta ? '<span class="badge bg-slate-200 text-slate-500">Già posta</span>' : ''}
    </button></li>`;
  };
  el.innerHTML = CAT_ANAM.map(c => {
    const gr = lista.filter(d => d.cat === c.k); if (!gr.length) return '';
    const fatte = gr.filter(d => G.poste.has(d.id)).length;

/* ---------- Immagini simulate (generate in SVG) ---------- */
function tipoImmagine(e) {
  const t = (e.immagineTipo || '').toLowerCase(); if (t) return t;
  const n = (e.nome || '').toLowerCase();
  if (/ecg|elettrocardio/.test(n)) return 'ecg-normale';
  if (/eco/.test(n)) return 'eco';
  if (/\brx\b|radiograf/.test(n)) return 'rx';
  if (/\btc\b|tomograf/.test(n)) return 'tc';
  if (/\brm\b|risonanza/.test(n)) return 'rm';
  if (/endoscop|egds|colonscop/.test(n)) return 'endo';
  return 'tc';
}

function svgEcg(variante, rnd) {
  const C = ({ normale:{ bpm:72 }, tachi:{ bpm:128 }, fa:{ bpm:132, irr:1, p:0 }, stemi:{ bpm:84, st:.5 }, ischemia:{ bpm:82, st:-.18, tInv:1 }, bradi:{ bpm:40 }, pericardite:{ bpm:92, st:.2 } })[variante] || { bpm:72 };
  const W = 1200, H = 360, B = 205, A = 80, SX = 200, rr = 60 / C.bpm, beats = [];
  let t = .35;
  while (t < W / SX + .6) { beats.push(t); t += C.irr ? rr * (.55 + rnd() * .9) : rr; }
  const g = (x, m, s) => Math.exp(-((x - m) ** 2) / (2 * s * s));
  const win = x => (1 / (1 + Math.exp(-(x - .05) / .008))) * (1 / (1 + Math.exp((x - .30) / .02)));
  const f = x => (C.p === 0 ? 0 : .14 * g(x, -.17, .035)) - .12 * g(x, -.035, .011) + 1.05 * g(x, 0, .013) - .22 * g(x, .038, .013) + (C.st || 0) * win(x) + (C.tInv ? -.32 : .32) * g(x, .27, .06);
  let d = '';
  for (let px = 0; px <= W; px += 2) {
    const tt = px / SX; let v = 0;
    for (const b of beats) { const x = tt - b; if (x > -.4 && x < .6) v += f(x); }
    if (C.p === 0) v += .05 * Math.sin(tt * 52) + .035 * Math.sin(tt * 91 + 1.3);
    d += (px ? 'L' : 'M') + px + ' ' + (B - v * A).toFixed(1);
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}"><defs>
    <pattern id="s" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M8 0H0V8" fill="none" stroke="#f5b5b5" stroke-width=".6"/></pattern>
    <pattern id="l" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="url(#s)"/><path d="M40 0H0V40" fill="none" stroke="#ee8a8a" stroke-width="1.2"/></pattern></defs>
    <rect width="${W}" height="${H}" fill="#fff6f6"/><rect width="${W}" height="${H}" fill="url(#l)"/>
    <path d="${d}" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
    <text x="14" y="30" font-family="monospace" font-size="20" fill="#333">II</text>
    <text x="${W - 14}" y="${H - 14}" text-anchor="end" font-family="monospace" font-size="14" fill="#555">25 mm/s · 10 mm/mV · SIMULAZIONE DIDATTICA</text></svg>`;
}

function svgImmagine(tipo, rnd, nome) {
  const W = 800, H = 600, r = (a, b) => a + rnd() * (b - a);
  const blobs = (n, x0, x1, y0, y1, fill, op, rx, ry) => { let s = ''; for (let i = 0; i < n; i++) s += `<ellipse cx="${r(x0, x1).toFixed(0)}" cy="${r(y0, y1).toFixed(0)}" rx="${r(rx[0], rx[1]).toFixed(0)}" ry="${r(ry[0], ry[1]).toFixed(0)}" fill="${fill}" opacity="${r(op[0], op[1]).toFixed(2)}" transform="rotate(${r(-40, 40).toFixed(0)} 400 300)"/>`; return s; };
  const defs = `<defs>
    <filter id="n" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="${tipo.startsWith('eco') ? .85 : .6}" numOctaves="3" seed="${Math.floor(rnd() * 90)}"/><feColorMatrix type="matrix" values="0 0 0 0 .85  0 0 0 0 .85  0 0 0 0 .85  0 0 0 1.5 -.4"/></filter>
    <filter id="b" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="b2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <radialGradient id="g" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#9a9a9a"/><stop offset="1" stop-color="#202020"/></radialGradient>
    <radialGradient id="p" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#3b0d0d"/><stop offset=".45" stop-color="#b8584f"/><stop offset="1" stop-color="#e29a8a"/></radialGradient></defs>`;
  let corpo = '';
  if (tipo.startsWith('eco')) {
    const ang = 42 * Math.PI / 180, R = 560, ax = 400, ay = 30, x1 = ax - R * Math.sin(ang), x2 = ax + R * Math.sin(ang), y1 = ay + R * Math.cos(ang);
    const sector = `M${ax} ${ay} L${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 0 0 ${x2.toFixed(1)} ${y1.toFixed(1)} Z`;
    corpo = `<clipPath id="c"><path d="${sector}"/></clipPath><path d="${sector}" fill="url(#g)"/>
      <g clip-path="url(#c)">${blobs(5, 280, 520, 160, 460, '#000', [.45, .8], [40, 110], [25, 70])}${blobs(3, 280, 520, 160, 460, '#e5e5e5', [.25, .5], [30, 80], [18, 45])}<rect width="${W}" height="${H}" filter="url(#n)" opacity=".8"/></g>`;
  } else if (tipo === 'rx' && /torace/i.test(nome)) {
    let coste = ''; for (let i = 0; i < 7; i++) coste += `<path d="M${130 + i * 6} ${110 + i * 55}Q400 ${60 + i * 55} ${670 - i * 6} ${110 + i * 55}" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="9"/>`;
    corpo = `<ellipse cx="275" cy="320" rx="150" ry="230" fill="#4a4a4a" filter="url(#b)"/><ellipse cx="525" cy="320" rx="150" ry="230" fill="#4a4a4a" filter="url(#b)"/>
      <rect x="360" y="60" width="80" height="480" rx="40" fill="#cfcfcf" opacity=".55" filter="url(#b)"/><ellipse cx="460" cy="380" rx="90" ry="110" fill="#d6d6d6" opacity=".55" filter="url(#b)"/>${coste}
      <path d="M200 40Q400 90 600 40" fill="none" stroke="#eee" stroke-opacity=".4" stroke-width="12"/>`;
  } else if (tipo === 'rx') {
    corpo = `<rect x="330" y="30" width="140" height="250" rx="60" fill="#d8d8d8" opacity=".85" filter="url(#b2)"/><rect x="350" y="60" width="100" height="190" rx="40" fill="#555" opacity=".7" filter="url(#b2)"/>
      <rect x="320" y="310" width="160" height="260" rx="64" fill="#d8d8d8" opacity=".85" filter="url(#b2)"/><rect x="342" y="340" width="116" height="200" rx="46" fill="#555" opacity=".7" filter="url(#b2)"/>
      <ellipse cx="400" cy="296" rx="90" ry="20" fill="#000" opacity=".5" filter="url(#b2)"/>`;
  } else if (tipo === 'endo') {
    corpo = `<circle cx="400" cy="300" r="280" fill="url(#p)"/><ellipse cx="400" cy="300" rx="70" ry="90" fill="#220505" opacity=".85" filter="url(#b)"/>${blobs(6, 200, 600, 120, 480, '#7a2e28', [.2, .45], [30, 70], [60, 140])}<ellipse cx="300" cy="200" rx="60" ry="30" fill="#fff" opacity=".35" filter="url(#b)"/>`;
  } else {
    corpo = `<circle cx="400" cy="300" r="255" fill="url(#g)"/><circle cx="400" cy="300" r="255" fill="none" stroke="#f0f0f0" stroke-width="16" opacity=".8"/>
      ${blobs(6, 250, 550, 170, 430, '#d0d0d0', [.25, .6], [40, 100], [30, 80])}${blobs(4, 250, 550, 170, 430, '#000', [.35, .7], [25, 70], [20, 55])}<rect width="${W}" height="${H}" filter="url(#n)" opacity=".5"/>`;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}">${defs}<rect width="${W}" height="${H}" fill="#050505"/>${corpo}
    <text x="18" y="30" fill="#e5e5e5" font-family="monospace" font-size="18">${esc(nome).toUpperCase().slice(0, 46)}</text>
    <text x="${W - 18}" y="${H - 16}" text-anchor="end" fill="#a3a3a3" font-family="monospace" font-size="14">IMMAGINE SIMULATA · USO DIDATTICO</text></svg>`;
}

function generaImmagine(e) {
  const tipo = tipoImmagine(e), rnd = prng(hashStr((G ? G.caso.id : '') + e.id));

function calcolaPunteggio() {
  const c = G.caso, tutti = [...c.esami.laboratorio, ...c.esami.strumentali];
  const presc = tutti.filter(e => G.prescritti.includes(e.id));
  const ess = presc.filter(e => e.essenziale), non = presc.filter(e => !e.essenziale);
  const mancanti = tutti.filter(e => e.essenziale && !G.prescritti.includes(e.id));
  const sum = a => a.reduce((s, e) => s + (+e.costo || 0), 0);
  const corretta = !!G.scelta.corretta;
  const bonus = corretta ? 50 : 0, penalita = corretta && mancanti.length ? 20 : 0;
  const sparo = non.length >= 4 ? 15 : 0;
  const ideale = 150 - sum(tutti.filter(e => e.essenziale));
  const grezzo = 100 - sum(ess) - sum(non) + bonus - penalita - sparo;
  return { corretta, ess, non, mancanti, costoEss:sum(ess), costoNon:sum(non), bonus, penalita, sparo, ideale, totale:Math.max(0, grezzo), tutti };
}

function apriModal(html, { dismissable = true } = {}) {

function importaProgressi(testo) {
  let d; try { d = JSON.parse(testo); } catch (e) { return toast('File non valido'); }
  const src = d && (d.progress || d); if (!src || typeof src.casi !== 'object') return toast('File non valido');
  const ids = new Set(CASI.map(c => c.id)); let n = 0;
  Object.entries(src.casi).forEach(([id, r]) => {
    if (!ids.has(id) || !r || typeof r !== 'object') return;
    const loc = progress.casi[id];
    if (!loc) { progress.casi[id] = r; n++; return; }
    const piuRecente = (r.ultimaData || r.data || '') > (loc.ultimaData || loc.data || '') ? r : loc, altro = piuRecente === r ? loc : r;
    progress.casi[id] = { ...altro, ...piuRecente, tentativi:Math.max(loc.tentativi || 0, r.tentativi || 0), corretti:Math.max(correttiCaso(loc), correttiCaso(r)),
      punteggioMax:Math.max(loc.punteggioMax || 0, r.punteggioMax || 0), completato:!!(loc.completato || r.completato) };
    n++;
  });
  salvaProgresso(); chiudiModal(); renderLibrary(); toast(`Importati ${n} casi`);
}
document.addEventListener('change', e => {
  if (e.target.id !== 'import-file' || !e.target.files[0]) return;
  const fr = new FileReader(); fr.onload = () => importaProgressi(String(fr.result)); fr.readAsText(e.target.files[0]);
});
AZIONI['apri-livelli'] = () => {
  const pt = progress.punteggioGlobale, lv = livelloDi(pt), next = LIVELLI.find(l => l.min > pt);
  const righe = LIVELLI.map((l, i) => {
    const sup = pt >= l.min, cur = l.nome === lv.nome, fine = LIVELLI[i + 1] ? LIVELLI[i + 1].min : null;
    return `<li class="flex items-center gap-3 px-4 py-3 border-b border-slate-100 ${cur ? 'bg-blue-50' : ''}">
      <div class="w-9 h-9 rounded-xl flex items-center justify-center ${sup ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-400'}">${icon(l.ic,'w-5 h-5')}</div>
      <div class="flex-1 min-w-0"><div class="text-sm font-bold ${sup ? 'text-slate-900' : 'text-slate-500'}">${l.nome}${cur ? ' <span class="text-[10px] font-extrabold text-blue-700 uppercase tracking-wider ml-1">Sei qui</span>' : ''}</div>
      <div class="text-xs text-slate-500">${fine ? `da ${l.min} a ${fine - 1} pt` : `da ${l.min} pt`}</div></div>
      <div class="text-xs font-bold tabular-nums ${sup ? 'text-emerald-600' : 'text-slate-400'}">${sup ? 'Raggiunto' : `mancano ${l.min - pt}`}</div></li>`;
  }).join('');
  const perc = next ? Math.round((pt - lv.min) / (next.min - lv.min) * 100) : 100;
  apriModal(`<div class="modal-card" style="max-width:30rem">
    <div class="px-5 pt-5 pb-4 border-b border-slate-100"><div class="flex items-center justify-between"><h3 class="text-lg font-extrabold">Livelli</h3><button class="btn btn-sm" data-action="chiudi-modal">Chiudi</button></div>
    <p class="text-xs text-slate-500 mt-1">Hai ${pt} pt. Conta il miglior punteggio di ogni caso risolto correttamente (il massimo dipende dagli esami essenziali del caso).</p>
    <div class="h-2 bg-slate-100 rounded-full mt-3 overflow-hidden"><div class="h-full bg-blue-600 rounded-full" style="width:${perc}%"></div></div>
    <p class="text-[11px] text-slate-500 mt-1.5">${next ? `${next.min - pt} pt a «${next.nome}»` : 'Livello massimo raggiunto'}</p></div>
    <ul>${righe}</ul>
    <div class="px-4 py-4 border-t border-slate-100 bg-slate-50 flex items-center justify-between gap-3">
      <div class="text-xs text-slate-500">Ricomincia da zero: cancella punteggi, medaglie e cronologia dei casi.</div>
      <button class="btn btn-sm text-red-600 border border-red-200 bg-white hover:bg-red-50" data-action="chiedi-reset">${icon('rotate-ccw','w-4 h-4')} Azzera punteggi</button>
    </div></div>`);
};
AZIONI['chiedi-reset'] = () => {
  const n = Object.keys(progress.casi).length;
  apriModal(`<div class="modal-card" style="max-width:26rem">
    <div class="px-5 pt-5 pb-3"><div class="flex items-center gap-2 text-red-600 font-extrabold text-lg">${icon('alert-triangle','w-5 h-5')} Azzerare tutti i punteggi?</div>
    <p class="text-sm text-slate-600 mt-2">Verranno cancellati ${progress.punteggioGlobale} punti, il livello e i progressi di ${n} cas${n === 1 ? 'o' : 'i'}. L'azione non si può annullare.</p>
    <p class="text-xs text-slate-500 mt-2">Se vuoi conservarli, esportali prima da «Statistiche».</p></div>
    <div class="px-5 pb-5 flex gap-2"><button class="btn btn-outline flex-1" data-action="apri-livelli">Annulla</button><button class="btn btn-primary flex-1 !bg-red-600 hover:!bg-red-700" data-action="conferma-reset">Sì, azzera tutto</button></div></div>`);
};
AZIONI['conferma-reset'] = () => {
  progress = { casi:{}, punteggioGlobale:0 }; salvaProgresso();
  ui = { search:'', spec:'', diff:'', stato:'', vista:'' }; chiudiModal(); renderLibrary(); toast('Punteggi azzerati');
};
AZIONI['scegli-dx'] = d => { if (G.finito) return; G.scelta = G.opzioni.find(o => o.id === d.id) || null; renderStepper(); renderTab(); };
AZIONI['conferma-dx'] = () => {
  if (!G.scelta || G.finito) return;
  G.finito = true;
  const c = G.caso, r = calcolaPunteggio(), prima = livelloDi(progress.punteggioGlobale);
  const rec = progress.casi[c.id] || { tentativi:0, punteggioMax:0, completato:false, stato:'Da riprovare' };
  const nuovoRecord = r.corretta && r.totale > rec.punteggioMax;
  rec.tentativi++; rec.ultimoPunteggio = r.totale; rec.data = new Date().toISOString();
  rec.ultimaData = rec.data; rec.ultimoCorretto = r.corretta; rec.ideale = r.ideale;
  rec.corretti = (rec.corretti || 0) + (r.corretta ? 1 : 0);
  if (rec.tentativi === 1) rec.primaCorretta = r.corretta;
  rec.ultimaMed = r.corretta ? medaglia(r.totale, r.ideale).n : null;
  if (r.corretta) { rec.completato = true; rec.stato = 'Completato'; rec.punteggioMax = Math.max(rec.punteggioMax, r.totale); }
  else if (!rec.completato) rec.stato = 'Da riprovare';
  progress.casi[c.id] = rec;
  salvaProgresso();
  const dopo = livelloDi(progress.punteggioGlobale);
  renderTab();
  apriDebrief(r, dopo.nome !== prima.nome ? dopo : null, nuovoRecord);
};
AZIONI['avvia-di-nuovo'] = () => avviaCaso(G.caso.id);
AZIONI['prossimo-caso'] = () => {
  const i = CASI.findIndex(c => c.id === G.caso.id), n = CASI.length;
  for (let k = 1; k <= n; k++) { const c = CASI[(i + k) % n]; if (!(progress.casi[c.id] && progress.casi[c.id].completato)) return avviaCaso(c.id); }
  avviaCaso(CASI[(i + 1) % n].id);
};

/* ---------- Eventi globali ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]'); if (!t) return;
  const fn = AZIONI[t.dataset.action]; if (fn) fn(t.dataset, t, e);
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'search-caso') { ui.search = e.target.value; aggiornaGriglia(); }
  else if (id === 'search-domande' && G) { G.filtroDomande = e.target.value; renderListaDomande(); }
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'filtro-spec') { ui.spec = e.target.value; aggiornaGriglia(); }
  else if (id === 'filtro-diff') { ui.diff = e.target.value; renderLibrary(); }
  else if (id === 'filtro-stato') { ui.stato = e.target.value; aggiornaGriglia(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#lightbox-root').innerHTML) return chiudiLightbox();
  const d = $('#drawer'); if (d && d.classList.contains('open')) return chiudiDrawer();
  const b = $('.modal-backdrop'); if (b && b.dataset.dismissable === '1') chiudiModal();
});
document.addEventListener('error', e => {
  const im = e.target;
  if (im && im.tagName === 'IMG' && im.dataset.fb && !im.dataset.done) { im.dataset.done = '1'; const ex = trovaEsame(im.dataset.fb); if (ex) im.src = generaImmagine(ex); }
}, true);

/* ---------- Avvio ---------- */
renderLibrary();
})();
</script>
</body>
</html>
